AWSTemplateFormatVersion: '2010-09-09'

Description: |
  Root CloudFormation template for Cloud Dictionary Application. Creates:
  - DynamoDB Receipts table with event streams and point-in-time recovery


Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Nested Stack Configuration"
        Parameters:
          - NestedStacksS3BucketName
      - Label:
          default: "KMS Encryption"
        Parameters:
          - KmsKey
          - KmsKeyArn
      - Label:
          default: "Advanced Configuration"
        Parameters:
          - CiSuffix
      - Label:
          default: "Lambda Function Base Names"
        Parameters:
          - ListOrdersFunctionBaseName
          - GetOrderFunctionBaseName
          - GetProductFunctionBaseName
          - SearchProductsFunctionBaseName
          - SubmitRequestFunctionBaseName
      - Label:
          default: "Lambda Runtime"
        Parameters:
          - LambdaRuntime
    ParameterLabels:
      NestedStacksS3BucketName:
        default: "S3 Bucket Name"
      KmsKey:
        default: "KMS Key Alias"
      KmsKeyArn:
        default: "KMS Key ARN"
      ProjectName:
        default: "Project Name"
      Environment:
        default: "Environment"
      CiSuffix:
        default: "CI Suffix"

Parameters:
  NestedStacksS3BucketName:
    Type: String
    Default: "subhamay-cfn-templates-bucket-270453428528-us-east-1"
    Description: "S3 bucket name where the nested CloudFormation template is stored"
    MinLength: 3
    MaxLength: 63
    AllowedPattern: "^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
    ConstraintDescription: "S3 bucket name must be 3-63 characters, start and end with lowercase letter or number, and can contain hyphens and dots"

  ProjectName:
    Type: String
    Default: "elara"
    Description: "Project name to use as a bucket prefix"
    MinLength: 1
    MaxLength: 20
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Project name must be lowercase letters, numbers, and hyphens only"

  KmsKey:
    Type: String
    Default: "SB-KMS"
    AllowedPattern: "^(alias/[a-zA-Z0-9_-]+|arn:aws:kms:[a-z0-9-]+:[0-9]+:key/[a-zA-Z0-9-]+|[a-zA-Z0-9_-]+)?$"
    ConstraintDescription: "KMS Key can be a key name (e.g., my-key, auto-converted to alias/my-key), a KMS key alias (e.g., alias/my-key), or a full KMS key ARN (e.g., arn:aws:kms:region:account:key/key-id), or leave empty for no KMS encryption"
    Description: "Optional KMS Key for S3 bucket encryption. Accepts: key name (my-key), alias (alias/my-key), or ARN (arn:aws:kms:region:account:key/key-id). Plain key names are auto-converted to aliases."

  KmsKeyArn:
    Type: String
    Default: "arn:aws:kms:us-east-1:269235677084:key/e691f177-0403-4b15-b9a7-50b57b204140"
    AllowedPattern: "^(arn:aws:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+)?$"
    ConstraintDescription: "KMS Key ARN must be a full key ARN (arn:aws:kms:region:account:key/key-id) or empty for no KMS encryption"
    Description: "KMS key ARN used to encrypt CloudWatch Log Groups and granted to the Lambda IAM roles. Must be a full key ARN; aliases are not accepted by CloudWatch Logs."

  Environment:
    Type: String
    Default: devl
    Description: "Deployment environment for the S3 bucket"

  CiSuffix:
    Type: String
    Default: ""
    Description: "Optional CI suffix to append to the bucket name"

  ListOrdersFunctionBaseName:
    Type: String
    Default: "list-orders"
    Description: "Base name of the list-orders Lambda function (without the Shop Smart prefix)"
    MinLength: 1
    MaxLength: 40
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Function base name must be lowercase letters, numbers, and hyphens only"

  GetOrderFunctionBaseName:
    Type: String
    Default: "get-order"
    Description: "Base name of the get-order Lambda function (without the Shop Smart prefix)"
    MinLength: 1
    MaxLength: 40
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Function base name must be lowercase letters, numbers, and hyphens only"

  GetProductFunctionBaseName:
    Type: String
    Default: "get-product"
    Description: "Base name of the get-product Lambda function (without the Shop Smart prefix)"
    MinLength: 1
    MaxLength: 40
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Function base name must be lowercase letters, numbers, and hyphens only"

  SearchProductsFunctionBaseName:
    Type: String
    Default: "search-products"
    Description: "Base name of the search-products Lambda function (without the Shop Smart prefix)"
    MinLength: 1
    MaxLength: 40
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Function base name must be lowercase letters, numbers, and hyphens only"

  SubmitRequestFunctionBaseName:
    Type: String
    Default: "submit-request"
    Description: "Base name of the submit-request Lambda function (without the Shop Smart prefix)"
    MinLength: 1
    MaxLength: 40
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Function base name must be lowercase letters, numbers, and hyphens only"

  LambdaRuntime:
    Type: String
    Default: "python3.12"
    Description: "Runtime used by all five Lambda functions"
    AllowedPattern: "^(python|nodejs|java|dotnet|ruby|provided)[a-z0-9.]+$"
    ConstraintDescription: "Runtime must be a valid Lambda runtime identifier, for example python3.12 or nodejs20.x"

Conditions:
  HasKmsKey: !Not [!Equals [!Ref KmsKey, ""]]
  HasKmsKeyArn: !Not [!Equals [!Ref KmsKeyArn, ""]]
  HasCiSuffix: !Not [!Equals [!Ref CiSuffix, ""]]

Resources:

  OrdersDynamoDBTable:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested DynamoDB CloudFormation template to create the orders table (partition key orderId, String) with on-demand billing, KMS encryption, point-in-time recovery, and a customerId global secondary index"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
          - "CloudFormation service must have permission to create DynamoDB tables and global secondary indexes, and to use the specified KMS key"
    Properties:
      TemplateURL: !Sub "https://${NestedStacksS3BucketName}.s3.us-east-1.amazonaws.com/cfn-nested-aws-dynamodb-table/template.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        TableBaseName: "orders"
        Environment: !Ref Environment
        BillingMode: "PAY_PER_REQUEST"
        PartitionKeyName: "orderId"
        PartitionKeyType: "S"
        EnablePointInTimeRecovery: "true"
        GSI1Enabled: "true"
        GSI1PartitionKeyName: "customerId"
        GSI1PartitionKeyType: "S"
        KmsKey: !If [HasKmsKey, !Ref KmsKey, ""]
        CiSuffix: !Ref CiSuffix
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: OrdersDatabase
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 10

  ProductsDynamoDBTable:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested DynamoDB CloudFormation template to create the products table (partition key productId, String) with on-demand billing, KMS encryption, and point-in-time recovery"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
          - "CloudFormation service must have permission to create DynamoDB tables and to use the specified KMS key"
    Properties:
      TemplateURL: !Sub "https://${NestedStacksS3BucketName}.s3.us-east-1.amazonaws.com/cfn-nested-aws-dynamodb-table/template.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        TableBaseName: "products"
        Environment: !Ref Environment
        BillingMode: "PAY_PER_REQUEST"
        PartitionKeyName: "productId"
        PartitionKeyType: "S"
        EnablePointInTimeRecovery: "true"
        KmsKey: !If [HasKmsKey, !Ref KmsKey, ""]
        CiSuffix: !Ref CiSuffix
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: ProductsDatabase
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 10

  ListOrdersLambdaCWLogGroup:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested CloudWatch Logs CloudFormation template to create the /aws/lambda/<project>-list-orders-<env>-<region> log group with 14-day retention and optional KMS encryption"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
          - "CloudFormation service must have permission to create CloudWatch Logs log groups"
          - "If KmsKeyArn is set, the key policy must allow the CloudWatch Logs service principal to use it"
    Properties:
      TemplateURL: !Sub "https://${NestedStacksS3BucketName}.s3.us-east-1.amazonaws.com/cfn-nested-aws-cloudwatch-log-group/template.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        CustomLogGroupName: !If
          - HasCiSuffix
          - !Sub "/aws/lambda/${ProjectName}-${ListOrdersFunctionBaseName}-${Environment}-${AWS::Region}-${CiSuffix}"
          - !Sub "/aws/lambda/${ProjectName}-${ListOrdersFunctionBaseName}-${Environment}-${AWS::Region}"
        RetentionInDays: 14
        KmsKeyIdOrAlias: !If [HasKmsKeyArn, !Ref KmsKeyArn, ""]
        Environment: !Ref Environment
        CiSuffix: !Ref CiSuffix
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: ListOrdersLogGroup
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 5

  GetOrderLambdaCWLogGroup:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested CloudWatch Logs CloudFormation template to create the /aws/lambda/<project>-get-order-<env>-<region> log group with 14-day retention and optional KMS encryption"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
          - "CloudFormation service must have permission to create CloudWatch Logs log groups"
          - "If KmsKeyArn is set, the key policy must allow the CloudWatch Logs service principal to use it"
    Properties:
      TemplateURL: !Sub "https://${NestedStacksS3BucketName}.s3.us-east-1.amazonaws.com/cfn-nested-aws-cloudwatch-log-group/template.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        CustomLogGroupName: !If
          - HasCiSuffix
          - !Sub "/aws/lambda/${ProjectName}-${GetOrderFunctionBaseName}-${Environment}-${AWS::Region}-${CiSuffix}"
          - !Sub "/aws/lambda/${ProjectName}-${GetOrderFunctionBaseName}-${Environment}-${AWS::Region}"
        RetentionInDays: 14
        KmsKeyIdOrAlias: !If [HasKmsKeyArn, !Ref KmsKeyArn, ""]
        Environment: !Ref Environment
        CiSuffix: !Ref CiSuffix
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: GetOrderLogGroup
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 5

  GetProductLambdaCWLogGroup:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested CloudWatch Logs CloudFormation template to create the /aws/lambda/<project>-get-product-<env>-<region> log group with 14-day retention and optional KMS encryption"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
          - "CloudFormation service must have permission to create CloudWatch Logs log groups"
          - "If KmsKeyArn is set, the key policy must allow the CloudWatch Logs service principal to use it"
    Properties:
      TemplateURL: !Sub "https://${NestedStacksS3BucketName}.s3.us-east-1.amazonaws.com/cfn-nested-aws-cloudwatch-log-group/template.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        CustomLogGroupName: !If
          - HasCiSuffix
          - !Sub "/aws/lambda/${ProjectName}-${GetProductFunctionBaseName}-${Environment}-${AWS::Region}-${CiSuffix}"
          - !Sub "/aws/lambda/${ProjectName}-${GetProductFunctionBaseName}-${Environment}-${AWS::Region}"
        RetentionInDays: 14
