          - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-${GetOrderFunctionBaseName}-${Environment}-${AWS::Region}:*"
        CiSuffix: !Ref CiSuffix

  GetProductLambdaIAMRole:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested IAM role CloudFormation template to create the get-product Lambda execution role, trusted by lambda.amazonaws.com, with CloudWatch Logs write access to its log group, read-only access to the products table, and KMS access when a KmsKeyArn is set"
