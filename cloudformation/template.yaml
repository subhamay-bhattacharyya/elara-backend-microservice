          - !Sub "/aws/lambda/${ProjectName}-${SearchProductsFunctionBaseName}-${Environment}-${AWS::Region}-${CiSuffix}"
          - !Sub "/aws/lambda/${ProjectName}-${SearchProductsFunctionBaseName}-${Environment}-${AWS::Region}"
        RetentionInDays: 14
        KmsKeyIdOrAlias: !If [HasKmsKeyArn, !Ref KmsKeyArn, ""]
        Environment: !Ref Environment
        CiSuffix: !Ref CiSuffix
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: SearchProductsLogGroup
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 5

  SubmitRequestLambdaCWLogGroup:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested CloudWatch Logs CloudFormation template to create the /aws/lambda/<project>-submit-request-<env>-<region> log group with 14-day retention and optional KMS encryption"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
          - "CloudFormation service must have permission to create CloudWatch Logs log groups"
          - "If KmsKeyArn is set, the key policy must allow the CloudWatch Logs service principal to use it"
    Properties:
      TemplateURL: !Sub "https://${NestedStacksS3BucketName}.s3.us-east-1.amazonaws.com/cfn-nested-aws-cloudwatch-log-group/template.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        CustomLogGroupName: !If
          - HasCiSuffix
          - !Sub "/aws/lambda/${ProjectName}-${SubmitRequestFunctionBaseName}-${Environment}-${AWS::Region}-${CiSuffix}"
          - !Sub "/aws/lambda/${ProjectName}-${SubmitRequestFunctionBaseName}-${Environment}-${AWS::Region}"
        RetentionInDays: 14
