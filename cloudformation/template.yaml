      TimeoutInMinutes: 5

  ListOrdersLambdaIAMRole:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested IAM role CloudFormation template to create the list-orders Lambda execution role, trusted by lambda.amazonaws.com, with CloudWatch Logs write access to its log group, read-only access to the orders table, and KMS access when a KmsKeyArn is set"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
          - "CloudFormation service must have permission to create IAM roles and inline policies"
    Properties:
      TemplateURL: !Sub "https://${NestedStacksS3BucketName}.s3.us-east-1.amazonaws.com/cfn-nested-aws-iam-roles-policies/template.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        RoleName: !Ref ListOrdersFunctionBaseName
        Environment: !Ref Environment
        AssumeRolePrincipal: "lambda.amazonaws.com"
        EnableLambdaBasicExecutionPolicy: "true"
        EnableKMSPolicy: !If [HasKmsKeyArn, "true", "false"]
        KMSKeyArn: !Ref KmsKeyArn
        EnableDynamoDBReadOnlyPolicy: "true"
        DynamoDBTableArn: !GetAtt OrdersDynamoDBTable.Outputs.TableArn
        LambdaBasicExecutionLogGroupArn: !If
          - HasCiSuffix
          - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-${ListOrdersFunctionBaseName}-${Environment}-${AWS::Region}-${CiSuffix}:*"
          - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-${ListOrdersFunctionBaseName}-${Environment}-${AWS::Region}:*"
        CiSuffix: !Ref CiSuffix

  GetOrderLambdaIAMRole:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested IAM role CloudFormation template to create the get-order Lambda execution role, trusted by lambda.amazonaws.com, with CloudWatch Logs write access to its log group, read-only access to the orders table, and KMS access when a KmsKeyArn is set"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
          - "CloudFormation service must have permission to create IAM roles and inline policies"
    Properties:
      TemplateURL: !Sub "https://${NestedStacksS3BucketName}.s3.us-east-1.amazonaws.com/cfn-nested-aws-iam-roles-policies/template.yaml"
