        KMSKeyArn: !Ref KmsKeyArn
        EnableDynamoDBReadOnlyPolicy: "true"
        DynamoDBTableArn: !GetAtt ProductsDynamoDBTable.Outputs.TableArn
        LambdaBasicExecutionLogGroupArn: !If
          - HasCiSuffix
