          - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-${SubmitRequestFunctionBaseName}-${Environment}-${AWS::Region}:*"
        CiSuffix: !Ref CiSuffix

  ListOrdersLambdaFunction:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    DependsOn:
      - ListOrdersLambdaCWLogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested Lambda function CloudFormation template to create the list-orders function using its IAM execution role and log group, with the orders table name passed as DYNAMODB_TABLE_NAME"
        must:
          - "Nested template must be accessible at the specified S3 location"
          - "IAM principal must have s3:GetObject permission on the template S3 bucket"
