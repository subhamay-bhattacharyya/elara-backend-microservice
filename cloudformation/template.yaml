          - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-${SearchProductsFunctionBaseName}-${Environment}-${AWS::Region}:*"
        CiSuffix: !Ref CiSuffix

  SubmitRequestLambdaIAMRole:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested IAM role CloudFormation template to create the submit-request Lambda execution role, trusted by lambda.amazonaws.com, with CloudWatch Logs write access to its log group, read/write access to the orders table, and KMS access when a KmsKeyArn is set"
