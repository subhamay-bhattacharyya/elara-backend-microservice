  SubmitRequestLambdaCWLogGroup:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: "Invokes the nested CloudWatch Logs CloudFormation template to create the /aws/lambda/<project>-submit-request-<env>-<region> log group with 14-day retention and optional KMS encryption"
        must:
          - "Nested template must be accessible at the specified S3 location"
