Outputs:

  DynamoDBTableName:
    Description: "Name of the DynamoDB table created by the nested stack"
    Value: !GetAtt OrdersDynamoDBTable.Outputs.TableName

  DynamoDBTableArn:
    Description: "ARN of the DynamoDB table created by the nested stack"
    Value: !GetAtt OrdersDynamoDBTable.Outputs.TableArn

  ProductsDynamoDBTableName:
    Description: "Name of the Products DynamoDB table created by the nested stack"
    Value: !GetAtt ProductsDynamoDBTable.Outputs.TableName

  ProductsDynamoDBTableArn:
    Description: "ARN of the Products DynamoDB table created by the nested stack"
    Value: !GetAtt ProductsDynamoDBTable.Outputs.TableArn
